[project]
name = "mancuoj-blog"
version = "0.1.0"
description = "极简 GitHub Issues 静态博客生成器"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32,<3",
    "Jinja2>=3.1,<4",
    "markdown-it-py>=3,<5",
    "mdit-py-plugins>=0.4,<1",
    "linkify-it-py>=2,<3",
    "Pygments>=2.18,<3",
    "fonttools[woff]>=4.66,<5",
    "brotli>=1.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
