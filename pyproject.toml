[project]
name = "mancuoj-blog"
version = "0.1.0"
description = "极简 GitHub Issues 静态博客生成器"
requires-python = ">=3.12"
dependencies = [
    "requests==2.32.3",
    "Jinja2==3.1.4",
    "markdown-it-py==3.0.0",
    "mdit-py-plugins==0.4.2",
    "linkify-it-py==2.0.3",
    "Pygments==2.18.0",
    "fonttools[woff]==4.66.1",
    "brotli==1.1.0",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
