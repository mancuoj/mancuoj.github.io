<!DOCTYPE html>
<html lang="{{ cfg.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ cfg.title }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ cfg.description }}{% endblock %}">
<meta property="og:title" content="{% block ogtitle %}{{ cfg.title }}{% endblock %}">
<meta property="og:description" content="{% block ogdesc %}{{ cfg.description }}{% endblock %}">
<meta property="og:type" content="{% block ogtype %}website{% endblock %}">
<meta property="og:url" content="{% block ogurl %}{{ base }}/{% endblock %}">
<meta property="og:image" content="{{ cfg.avatar }}">
{% block ogmeta %}{% endblock %}
<link rel="icon" href="{{ cfg.avatar }}">
{% if cfg.showRss %}<link rel="alternate" type="application/rss+xml" title="{{ cfg.title }}" href="{{ base }}/rss.xml">
{% endif %}<link rel="stylesheet" href="{{ base }}/static/fonts.css?v={{ asset_ver }}">
<link rel="stylesheet" href="{{ base }}/static/style.css?v={{ asset_ver }}">
<script>
(function () {
  try {
    var t = localStorage.getItem("theme");
    if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
/* 尊重"减少动效": 跨页面过渡直接跳过, 走普通跳转 */
window.addEventListener("pagereveal", function (e) {
  if (e.viewTransition && window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    e.viewTransition.skipTransition();
  }
});
</script>
{% block head %}{% endblock %}
</head>
<body>
<header class="site-header">
  <a class="brand" href="{{ base }}/">{{ cfg.author }}<i>.</i></a>
  <div class="tagline">{{ cfg.subtitle }}</div>
</header>
<main class="site-main">
{% block content %}{% endblock %}
</main>
<script src="{{ base }}/static/app.js?v={{ asset_ver }}" defer></script>
</body>
</html>
